name: Pourtrait
options:
  bundleIdPrefix: com.pourtrait
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set to your Apple Developer Team ID before building

targets:
  Pourtrait:
    type: application
    platform: iOS
    sources:
      - path: Pourtrait
        excludes:
          - "Info.plist"
          - "Pourtrait.entitlements"
          - "Configuration.storekit"
      - path: Pourtrait/Configuration.storekit
        buildPhase: none
      - path: Shared
    dependencies:
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
      - target: PourtraitWidgets   # embeds the Live Activity extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pourtrait.app
        PRODUCT_NAME: Pourtrait
        INFOPLIST_FILE: Pourtrait/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pourtrait/Pourtrait.entitlements
        ENABLE_PREVIEWS: "YES"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    scheme:
      storeKitConfiguration: Pourtrait/Configuration.storekit

  PourtraitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PourtraitWidgets
        excludes:
          - "Info.plist"
          - "PourtraitWidgets.entitlements"
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pourtrait.app.widgets
        INFOPLIST_FILE: PourtraitWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PourtraitWidgets/PourtraitWidgets.entitlements
        SKIP_INSTALL: "YES"
