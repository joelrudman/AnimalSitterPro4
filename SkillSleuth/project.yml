name: SkillSleuth
options:
  bundleIdPrefix: com.skillsleuth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SkillSleuth:
    type: application
    platform: iOS
    sources:
      - path: SkillSleuth
        excludes:
          - "Info.plist"
          - "SkillSleuth.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skillsleuth.app
        INFOPLIST_FILE: SkillSleuth/Info.plist
        CODE_SIGN_ENTITLEMENTS: SkillSleuth/SkillSleuth.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_TEAM: "" # set to your Apple Developer Team ID before building
