name: RecruiterMatch
options:
  bundleIdPrefix: com.recruitermatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  RecruiterMatch:
    type: application
    platform: iOS
    sources:
      - path: RecruiterMatch
        excludes:
          - "Info.plist"
          - "RecruiterMatch.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recruitermatch.app
        INFOPLIST_FILE: RecruiterMatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: RecruiterMatch/RecruiterMatch.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_TEAM: "" # set to your Apple Developer Team ID before building
