name: BarBook
options:
  bundleIdPrefix: com.barbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0

targets:
  BarBook:
    type: application
    platform: iOS
    sources:
      - path: BarBook
        excludes:
          - "Info.plist"
          - "BarBook.entitlements"
          - "Configuration.storekit"
      - path: BarBook/Configuration.storekit
        buildPhase: none
    dependencies:
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barbook.app
        INFOPLIST_FILE: BarBook/Info.plist
        CODE_SIGN_ENTITLEMENTS: BarBook/BarBook.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        DEVELOPMENT_TEAM: "" # set to your Apple Developer Team ID before building
    scheme:
      storeKitConfiguration: BarBook/Configuration.storekit
