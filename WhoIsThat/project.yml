name: WhoIsThat
options:
  bundleIdPrefix: com.whoisthat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set to your Apple Developer Team ID before building

targets:
  WhoIsThat:
    type: application
    platform: iOS
    sources:
      - path: WhoIsThat
        excludes:
          - "Info.plist"
          - "WhoIsThat.entitlements"
          - "Configuration.storekit"
      - path: WhoIsThat/Configuration.storekit
        buildPhase: none
      - path: Shared
    dependencies:
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
      - target: WhoIsThatWidgets   # embeds the Live Activity extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoisthat.app
        PRODUCT_NAME: WhoIsThat
        INFOPLIST_FILE: WhoIsThat/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhoIsThat/WhoIsThat.entitlements
        ENABLE_PREVIEWS: "YES"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    scheme:
      storeKitConfiguration: WhoIsThat/Configuration.storekit

  WhoIsThatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WhoIsThatWidgets
        excludes:
          - "Info.plist"
          - "WhoIsThatWidgets.entitlements"
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoisthat.app.widgets
        INFOPLIST_FILE: WhoIsThatWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhoIsThatWidgets/WhoIsThatWidgets.entitlements
        SKIP_INSTALL: "YES"
